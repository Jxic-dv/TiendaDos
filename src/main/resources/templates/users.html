<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Tienda - Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="app-container">
    <nav class="sidebar">
        <div class="brand">Tienda Admin</div>
        <ul class="nav-links">
            <li><a th:href="@{/}">Inicio</a></li>
            <li><a th:href="@{/users}" class="active">Usuarios</a></li>
            <li><a th:href="@{/category}">Categorías</a></li>
            <li><a th:href="@{/product}">Productos</a></li>
            <li><a th:href="@{/order}">Pedidos</a></li>
            <li><a th:href="@{/orderdetail}">Detalles</a></li>
        </ul>
        <div class="search-box">
            <label>Buscar Usuario (ID)</label>
            <form th:action="@{/users/search}" method="get">
                <input type="number" name="id" placeholder="Ej. 10" required>
                <button type="submit" class="btn-search">Buscar</button>
            </form>
        </div>
        <div class="nav-footer">
            <a th:href="@{/logout}" class="btn-logout">Cerrar Sesión</a>
        </div>
    </nav>

    <main class="content">
        <div class="header-content">
            <h1 th:text="${editMode} ? 'Modificando Perfil' : 'Miembros de la Comunidad'"></h1>
        </div>

        <div class="form-container">
            <form th:action="@{/users/save}" th:object="${user}" method="post">
                <input type="hidden" th:field="*{userId}">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" th:field="*{firstName}" required>
                    </div>
                    <div class="form-group">
                        <label>Apellido</label>
                        <input type="text" th:field="*{lastName}" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" th:field="*{email}" required>
                    </div>
                    <div class="form-group">
                        <label>Edad</label>
                        <input type="number" th:field="*{age}" required>
                    </div>
                </div>
                <div style="margin-top: 25px;">
                    <button type="submit" class="btn-save">
                        [[${editMode} ? 'Actualizar Perfil' : 'Registrar Miembro']]
                    </button>
                    <a th:if="${editMode}" th:href="@{/users}" class="btn-cancel">Cancelar</a>
                </div>
            </form>
        </div>

        <div class="grid-cards">
            <div class="card" th:each="u : ${users}">
                <div class="card-info">
                    <div>
                        <div class="card-subtitle" th:text="${u.email}"></div>
                        <h3 class="card-title" th:text="${u.firstName} + ' ' + ${u.lastName}"></h3>
                    </div>
                    <div class="card-desc">
                        <strong style="color:var(--text-dark);">ID:</strong> <span th:text="${u.userId}"></span><br>
                        <strong style="color:var(--text-dark);">Edad:</strong> <span th:text="${u.age}"></span>
                    </div>
                    <div class="actions-links">
                        <a th:href="@{/users/edit/{id}(id=${u.userId})}" class="btn-action btn-edit">Editar</a>
                        <a th:href="@{/users/delete/{id}(id=${u.userId})}" class="btn-action btn-delete">Eliminar</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
