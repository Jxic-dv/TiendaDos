<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Tienda - Categorías</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="app-container">
    <nav class="sidebar">
        <div class="brand">Tienda Admin</div>
        <ul class="nav-links">
            <li><a th:href="@{/}">Inicio</a></li>
            <li><a th:href="@{/users}">Usuarios</a></li>
            <li><a th:href="@{/category}" class="active">Categorías</a></li>
            <li><a th:href="@{/product}">Productos</a></li>
            <li><a th:href="@{/order}">Pedidos</a></li>
            <li><a th:href="@{/orderdetail}">Detalles</a></li>
        </ul>
        <div class="search-box">
            <label>Buscar Categoría (ID)</label>
            <form th:action="@{/category/search}" method="get">
                <input type="number" name="id" placeholder="Ej. 1" required>
                <button type="submit" class="btn-search">Buscar</button>
            </form>
        </div>
        <div class="nav-footer">
            <a th:href="@{/logout}" class="btn-logout">Cerrar Sesión</a>
        </div>
    </nav>
    <main class="content">
        <div class="header-content">
            <h1 th:text="${editMode} ? 'Editando Categoría' : 'Gestión de Categorías'"></h1>
        </div>

        <div class="form-container">
            <form th:action="@{/category/save}" th:object="${category}" method="post">
                <input type="hidden" th:field="*{categoryId}">
                <div class="form-grid" style="grid-template-columns: 1fr 2fr;">
                    <div class="form-group">
                        <label>Nombre de Categoría</label>
                        <input type="text" th:field="*{categoryName}" required>
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea th:field="*{categoryDescription}" rows="1"></textarea>
                    </div>
                </div>
                <div style="margin-top: 25px;">
                    <button type="submit" class="btn-save">
                        [[${editMode} ? 'Actualizar Categoría' : 'Crear Nueva Categoría']]
                    </button>
                    <a th:if="${editMode}" th:href="@{/category}" class="btn-cancel">Cancelar</a>
                </div>
            </form>
        </div>

        <div class="grid-cards">
            <div class="card" th:each="c : ${categories}">
                <div class="card-info">
                    <div>
                        <div class="card-subtitle">Colección</div>
                        <h3 class="card-title" th:text="${c.categoryName}"></h3>
                    </div>
                    <div class="card-desc" style="height: 40px; overflow: hidden;" th:text="${c.categoryDescription}"></div>
                    <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: bold;">
                        ID: <span th:text="${c.categoryId}"></span>
                    </div>
                    <div class="actions-links">
                        <a th:href="@{/category/edit/{id}(id=${c.categoryId})}" class="btn-action btn-edit">Editar</a>
                        <a th:href="@{/category/delete/{id}(id=${c.categoryId})}" class="btn-action btn-delete">Eliminar</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
