<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Panel Administrativo</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="login-page">

<div class="login-container">

    <h2>Crea tu cuenta</h2>

    <form th:action="@{/register/save}" method="post">
        <input type="text" name="nombre" placeholder="Nombre completo" required>
        <input type="email" name="email" placeholder="Correo electrónico" required>
        <input type="text" name="username" placeholder="Usuario" required>
        <input type="password" name="password" placeholder="Contraseña" required>

        <button type="submit" class="btn-save" style="width: 100%; margin-top: 15px;">Registrarse</button>
    </form>

    <a th:href="@{/login}" style="display:inline-block; margin-top:20px; color:var(--text-muted); text-decoration:none; font-size:0.9rem;">
        ¿Ya tienes cuenta? Inicia sesión
    </a>
</div>

</body>
</html>
