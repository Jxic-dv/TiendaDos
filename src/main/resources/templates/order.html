<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Tienda - Pedidos</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="app-container">
    <nav class="sidebar">
        <div class="brand">Tienda Admin</div>
        <ul class="nav-links">
            <li><a th:href="@{/}">Inicio</a></li>
            <li><a th:href="@{/users}">Usuarios</a></li>
            <li><a th:href="@{/category}">Categorías</a></li>
            <li><a th:href="@{/product}">Productos</a></li>
            <li><a th:href="@{/order}" class="active">Pedidos</a></li>
            <li><a th:href="@{/orderdetail}">Detalles</a></li>
        </ul>
        <div class="search-box">
            <label>Buscar Pedido (ID)</label>
            <form th:action="@{/order/search}" method="get">
                <input type="number" name="id" placeholder="Ej. 50" required>
                <button type="submit" class="btn-search">Buscar</button>
            </form>
        </div>
        <div class="nav-footer">
            <a th:href="@{/logout}" class="btn-logout">Cerrar Sesión</a>
        </div>
    </nav>
    <main class="content">
        <div class="header-content">
            <h1 th:text="${editMode} ? 'Editando Pedido' : 'Registro de Pedidos'"></h1>
        </div>
        <div th:replace="~{order-forms :: orderForm}"></div>
        <div class="grid-cards">
            <div class="card" th:each="o : ${orders}">
                <div class="card-info">
                    <div>
                        <span class="price-tag" th:text="'$' + ${o.orderTotal}"></span>
                        <div class="card-subtitle" th:text="${o.orderDate}"></div>
                        <h3 class="card-title" th:text="'Pedido #' + ${o.orderId}"></h3>
                    </div>
                    <div class="card-desc">
                        <strong style="color:var(--text-dark);">Usuario ID:</strong> <span th:text="${o.user.userId}"></span><br>
                        <strong style="color:var(--text-dark);">Envío:</strong> <span th:text="${o.shippingAddress}"></span>
                    </div>
                    <div class="actions-links">
                        <a th:href="@{/order/edit/{id}(id=${o.orderId})}" class="btn-action btn-edit">Editar</a>
                        <a th:href="@{/order/delete/{id}(id=${o.orderId})}" class="btn-action btn-delete">Eliminar</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
