<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="orderForm">
    <div class="form-container">
        <form th:action="@{/order/save}" th:object="${order}" method="post">
            <input type="hidden" th:field="*{orderId}">

            <div class="form-grid">
                <div class="form-group">
                    <label>ID del Cliente / Usuario</label>
                    <select th:field="*{user.userId}" required>
                        <option value="" disabled selected>Seleccionar Usuario...</option>
                        <option th:each="u : ${users}" th:value="${u.userId}" th:text="'Usuario ID: ' + ${u.userId}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Total del Pedido ($)</label>
                    <input type="number" step="0.01" th:field="*{orderTotal}" placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label>Dirección de Envío</label>
                    <input type="text" th:field="*{shippingAddress}" placeholder="Ej. Calle 1-23 Zona 1..." required>
                </div>

                <input type="hidden" th:field="*{orderDate}">
            </div>

            <div style="margin-top: 25px;">
                <button type="submit" class="btn-save">
                    [[${editMode} ? 'Guardar Cambios' : 'Registrar Pedido']]
                </button>
                <a th:if="${editMode}" th:href="@{/order}" class="btn-cancel">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
