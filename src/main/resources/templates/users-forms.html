<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${editMode} ? 'Steam Admin - Edit User' : 'Steam Admin - New User'"></title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --steam-blue: #2a475e;
            --steam-dark: #1b2838;
            --steam-light-blue: #66c0f4;
            --steam-bg: #171a21;
            --steam-grey: #c7d5e0;
            --steam-success: #5c7e10;
        }

        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(to bottom, var(--steam-blue) 0%, var(--steam-bg) 100%);
            color: var(--steam-grey);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background-color: var(--steam-dark);
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h1 {
            font-size: 1.4rem;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0;
            border-bottom: 1px solid var(--steam-blue);
            padding-bottom: 15px;
            text-align: center;
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.8rem;
            color: var(--steam-light-blue);
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 10px;
            background-color: #121a24;
            border: 1px solid #233c51;
            color: white;
            border-radius: 2px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: var(--steam-light-blue);
        }

        .acciones {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 2px;
            text-decoration: none;
            text-align: center;
            font-size: 0.9rem;
        }

        .btn-confirmar {
            background: linear-gradient(to right, #75b022 5%, #588a1b 95%);
            color: white;
        }

        .btn-cancelar {
            background-color: #3d4450;
            color: var(--steam-grey);
        }
    </style>
</head>
<body>

<div class="container">
    <h1 th:text="${editMode} ? 'Edit Community Member' : 'Create New User'"></h1>

    <form th:action="@{/users/save}" th:object="${user}" method="post">

        <!-- ID Oculto -->
        <input type="hidden" th:field="*{userId}">

        <div style="display: flex; gap: 10px;">
            <div class="campo" style="flex: 1;">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" th:field="*{firstName}" placeholder="First name...">
            </div>

            <div class="campo" style="flex: 1;">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" th:field="*{lastName}" placeholder="Last name...">
            </div>
        </div>

        <div class="campo">
            <label for="email">Email Address</label>
            <input type="email" id="email" th:field="*{email}" placeholder="user@example.com">
        </div>

        <div class="campo">
            <label for="age">Age</label>
            <input type="number" id="age" th:field="*{age}" placeholder="0">
        </div>

        <div class="acciones">
            <button type="submit" class="btn btn-confirmar">
                [[${editMode} ? 'Update User' : 'Register User']]
            </button>
            <a th:href="@{/users}" class="btn btn-cancelar">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
