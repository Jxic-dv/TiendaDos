<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Panel Administrativo</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="app-container">
    <nav class="sidebar">
        <div class="brand">Tienda Admin</div>
        <ul class="nav-links">
            <li><a th:href="@{/}" class="active">Inicio</a></li>
            <li><a th:href="@{/users}">Usuarios</a></li>
            <li><a th:href="@{/category}">Categorías</a></li>
            <li><a th:href="@{/product}">Productos</a></li>
            <li><a th:href="@{/order}">Pedidos</a></li>
            <li><a th:href="@{/orderdetail}">Detalles</a></li>
        </ul>
        <div class="nav-footer">
            <a th:href="@{/logout}" class="btn-logout">Cerrar Sesión</a>
        </div>
    </nav>
    <main class="content">
        <header style="display:flex; justify-content:flex-end; margin-bottom:40px;">
            <img th:src="@{/logito.png}" alt="Logo" style="height:50px;">
        </header>
        <h1 class="dashboard-title">Bienvenido!</h1>
    </main>
</div>
</body>
</html>
