<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fragmento Formulario Producto</title>
</head>
<body>

<div th:fragment="form-producto">
    <div class="form-container">
        <!-- CAMBIO CLAVE: th:action="@{/product/save}" -->
        <form th:action="@{/product/save}" th:object="${product}" method="post">

            <input type="hidden" th:field="*{productId}">

            <div class="form-grid">
                <div class="form-group">
                    <label>Nombre del Producto</label>
                    <input type="text" th:field="*{productName}"
                           placeholder="Ej. Galaxy A35" required>
                </div>

                <div class="form-group">
                    <label>Marca / Desarrolladora</label>
                    <input type="text" th:field="*{brand}"
                           placeholder="Ej. Samsung">
                </div>

                <div class="form-group">
                    <label>Categoría</label>
                    <select th:field="*{category.categoryId}" required>
                        <option value="" disabled selected>Selecciona...</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.categoryId}"
                                th:text="${cat.categoryName}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Precio ($)</label>
                    <input type="number" step="0.01" th:field="*{productPrice}"
                           placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label>Unidades en Stock</label>
                    <input type="number" th:field="*{stock}"
                           placeholder="0" required>
                </div>
            </div>

            <div style="margin-top: 20px;">
                <button type="submit" class="btn-save">
                    [[${editMode} ? 'Actualizar Producto' : 'Añadir a Inventario']]
                </button>
                <!-- CAMBIO CLAVE: th:href="@{/product}" -->
                <a th:if="${editMode}" th:href="@{/product}"
                   style="color:white; margin-left:15px; font-size:0.8rem; text-decoration:none;">
                    CANCELAR
                </a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
