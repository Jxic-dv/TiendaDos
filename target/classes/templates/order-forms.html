<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="orderForm">
    <div class="form-container">
        <form th:action="@{/order/save}" th:object="${order}" method="post">
            <!-- ID oculto para saber si editamos o creamos -->
            <input type="hidden" th:field="*{orderId}">

            <div class="form-grid">
                <!-- CLIENTE (Selector) -->
                <div class="form-group">
                    <label>ID del Cliente / Usuario</label>
                    <select th:field="*{user.userId}" required>
                        <option value="" disabled selected>Seleccionar Usuario...</option>
                        <!-- He cambiado u.username por u.userId para evitar el error 500 -->
                        <option th:each="u : ${users}"
                                th:value="${u.userId}"
                                th:text="'Usuario ID: ' + ${u.userId}"></option>
                    </select>
                </div>

                <!-- TOTAL -->
                <div class="form-group">
                    <label>Total del Pedido ($)</label>
                    <input type="number" step="0.01" th:field="*{orderTotal}"
                           placeholder="0.00" required>
                </div>

                <!-- DIRECCIÓN -->
                <div class="form-group">
                    <label>Dirección de Envío</label>
                    <input type="text" th:field="*{shippingAddress}"
                           placeholder="Ej. Calle 1-23 Zona 1..." required>
                </div>

                <!-- Fecha (Oculta para que la maneje el Service) -->
                <input type="hidden" th:field="*{orderDate}">
            </div>

            <div style="margin-top: 20px;">
                <button type="submit" class="btn-save">
                    [[${editMode} ? 'GUARDAR CAMBIOS' : 'REGISTRAR PEDIDO']]
                </button>
                <a th:if="${editMode}" th:href="@{/order}"
                   style="color: #66c0f4; margin-left: 15px; font-size: 0.8rem; text-decoration: none;">
                    CANCELAR
                </a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
