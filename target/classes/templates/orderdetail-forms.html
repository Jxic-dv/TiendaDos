<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="detailForm">
    <div class="form-container">
        <form th:action="@{/orderdetail/save}" th:object="${orderDetail}" method="post">
            <input type="hidden" th:field="*{detailId}">

            <div class="form-grid">
                <div class="form-group">
                    <label>ID de la Orden</label>
                    <select th:field="*{order.orderId}" required>
                        <option value="" disabled selected>Seleccione Orden...</option>
                        <option th:each="o : ${orders}" th:value="${o.orderId}" th:text="'Orden #' + ${o.orderId}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Producto</label>
                    <select th:field="*{product.productId}" required>
                        <option value="" disabled selected>Seleccione Producto...</option>
                        <option th:each="p : ${products}" th:value="${p.productId}" th:text="${p.productName}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Cantidad</label>
                    <input type="number" th:field="*{quantity}" min="1" placeholder="0" required>
                </div>

                <div class="form-group">
                    <label>Precio Unitario ($)</label>
                    <input type="number" step="0.01" th:field="*{unitPrice}" placeholder="0.00" required>
                </div>
            </div>

            <div style="margin-top: 25px;">
                <button type="submit" class="btn-save">
                    [[${editMode} ? 'Actualizar Detalle' : 'Agregar al Pedido']]
                </button>
                <a th:if="${editMode}" th:href="@{/orderdetail}" class="btn-cancel">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
