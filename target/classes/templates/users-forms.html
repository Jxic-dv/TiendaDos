<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${editMode} ? 'Admin - Editar Usuario' : 'Admin - Nuevo Usuario'"></title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body style="display: flex; justify-content: center; align-items: center; background-color: var(--bg-light); height: 100vh; margin: 0;">

<div th:fragment="form-usuario" style="width: 100%; max-width: 600px; padding: 20px;">
    <div class="form-container">
        <h2 style="margin-top: 0; margin-bottom: 25px; color: var(--text-dark); font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 15px;"
            th:text="${editMode} ? 'Editar Miembro' : 'Crear Nuevo Usuario'"></h2>

        <form th:action="@{/users/save}" th:object="${user}" method="post">
            <input type="hidden" th:field="*{userId}">

            <div class="form-grid">
                <div class="form-group">
                    <label for="firstName">Nombre</label>
                    <input type="text" id="firstName" th:field="*{firstName}" placeholder="Nombre..." required>
                </div>

                <div class="form-group">
                    <label for="lastName">Apellido</label>
                    <input type="text" id="lastName" th:field="*{lastName}" placeholder="Apellido..." required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" th:field="*{email}" placeholder="usuario@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="age">Edad</label>
                    <input type="number" id="age" th:field="*{age}" placeholder="0" required>
                </div>
            </div>

            <div style="margin-top: 25px;">
                <button type="submit" class="btn-save">
                    [[${editMode} ? 'Actualizar Usuario' : 'Registrar Usuario']]
                </button>
                <a th:href="@{/users}" class="btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
