<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Tienda - Productos</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="app-container">
    <nav class="sidebar">
        <div class="brand">Tienda Admin</div>
        <ul class="nav-links">
            <li><a th:href="@{/}">Inicio</a></li>
            <li><a th:href="@{/users}">Usuarios</a></li>
            <li><a th:href="@{/category}">Categorías</a></li>
            <li><a th:href="@{/product}" class="active">Productos</a></li>
            <li><a th:href="@{/order}">Pedidos</a></li>
            <li><a th:href="@{/orderdetail}">Detalles</a></li>
        </ul>
        <div class="search-box">
            <label>Buscar Producto (ID)</label>
            <form th:action="@{/product/search}" method="get">
                <input type="number" name="id" placeholder="Ej. 101" required>
                <button type="submit" class="btn-search">Buscar</button>
            </form>
        </div>
        <div class="nav-footer">
            <a th:href="@{/logout}" class="btn-logout">Cerrar Sesión</a>
        </div>
    </nav>
    <main class="content">
        <div class="header-content">
            <h1 th:text="${editMode} ? 'Modificar Producto' : 'Catálogo de Productos'"></h1>
        </div>
        <div th:replace="~{product-forms :: form-producto}"></div>
        <div class="grid-cards">
            <div class="card" th:each="p : ${products}">
                <div class="card-info">
                    <div>
                        <span class="price-tag" th:text="'$' + ${p.productPrice}"></span>
                        <div class="card-subtitle" th:text="${p.category.categoryName}"></div>
                        <h3 class="card-title" th:text="${p.productName}"></h3>
                    </div>
                    <div class="card-desc" th:text="'Marca: ' + ${p.brand}"></div>
                    <div th:class="${p.stock < 5 ? 'badge danger' : 'badge'}">
                        Stock: <span th:text="${p.stock}"></span>
                    </div>
                    <div class="actions-links">
                        <a th:href="@{/product/edit/{id}(id=${p.productId})}" class="btn-action btn-edit">Editar</a>
                        <a th:href="@{/product/delete/{id}(id=${p.productId})}" class="btn-action btn-delete">Eliminar</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
